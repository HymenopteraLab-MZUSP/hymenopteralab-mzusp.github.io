# site properties and page defaults
title: HymenopteraLab
subtitle: Museu de Zoologia da Universidade de São Paulo (MZUSP)
description: Laboratório de Hymenoptera do Museu de Zoologia da Universidade de São Paulo — sistemática, filogenômica e biogeografia de formigas e outros Hymenoptera, e curadoria da Coleção de Hymenoptera do MZUSP.
header: images/background.jpg
footer: images/background.jpg
proofer: false
lang: pt-BR

# site social media and other links (shown in the footer)
links:
  email: gpcamacho@usp.br
  github: HymenopteraLab-MZUSP
  orcid: 0000-0002-8792-7719

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
  - COMO-EDITAR.md
  - CHANGELOG.md
  - testbed.md
  # exemplos do modelo original (podem ser apagados do repositório)
  - _members/jane-smith.md
  - _members/john-doe.md
  - _members/sarah-johnson.md
  - _posts/2019-01-07-example-post-1.md
  - _posts/2021-09-30-example-post-2.md
  - _posts/2023-02-23-example-post-3.md

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
