# Ordem e títulos das categorias da página Equipe.
# Cada pessoa aparece na categoria do "role" definido no arquivo dela em _members/.
# Categorias sem ninguém não aparecem. "sub: true" = subcategoria (dentro de Egressos);
# "list: true" = lista simples (nome, função e links), sem foto e sem caixa;
# "compact: true" = cartão sem foto.

- role: principal-investigator
  pt: Pesquisadora principal
  en: Principal Investigator
- role: gerente
  pt: Gerente de coleções
  en: Collection Manager
- role: pesquisador
  pt: Pesquisadores
  en: Researchers
- role: postdoc
