{%- comment -%}
  Painel do Power BI incorporado. Parâmetros: src (link "Publicar na Web"), title e open (texto do botão de tela cheia).
{%- endcomment -%}
<div class="powerbi-box">
<iframe src="{{ include.src }}" title="{{ include.title }}" loading="lazy" allowfullscreen></iframe>
</div>
<p class="powerbi-open"><a href="{{ include.src }}" target="_blank" rel="noopener"><i class="fa-solid fa-up-right-from-square"></i> {{ include.open }}</a></p>
<style>
.powerbi-box { position: relative; width: 100%; aspect-ratio: 16 / 9.6; min-height: 420px; border: 1px solid var(--light-gray, #ddd); border-radius: var(--rounded, 10px); overflow: hidden; margin: 20px 0 8px; background: var(--background-alt); }
.powerbi-box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.powerbi-open { text-align: right; margin: 0 0 20px; font-size: 0.95em; }
.dados-botoes { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 20px; }
.catalogos li { margin-bottom: 10px; }
</style>
